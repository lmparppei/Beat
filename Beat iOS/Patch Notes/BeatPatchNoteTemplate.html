<html>
	<head>
		<meta charset="utf-8"/>
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<style type='text/css'>
		
			@media (prefers-color-scheme: light) {
				:root {
					--main-bg: white;
					--main-color: #222;
				}
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--main-bg: #202022;
					--main-color: #eee;
				}
			}
		
			
			body {
				font-family: Helvetica, sans-serif;
				margin: 0;
				
				font-size: 1em;
				
				background: var(--main-bg);
				color: var(--main-color);
				
				font-weight: 300;
				
				box-sizing: border-box;
			}
			
			#top {
				padding: 2em 0 2em 0;
				background-color: rgba(0.6, 0.6, 0.6, 0.1);
				margin-bottom: 2em;
			}
			
			.content {
				max-width: 32em;
				margin: 0 auto 0 auto;
			}
			
			h1 {
				font-size: 1.6em;
				margin: 0;
				text-align: left;
			}
			h1::first-line {
				font-weight: 300;
			}
			
			h2 { margin: 1.5em 0 0.2em 0; font-size: 1.3em; font-weight: 300; }
			
			h3 { margin: 2.5em 0 0.2em 0; font-size: 1.1em; }
			
			.bugs {
				margin-top: 2em;
				padding: 1em 1.5em 1em 1.5em;
				font-size: 0.9em;
				background: rgba(160,160,160,0.2);
				border-radius: 0.9em;
				box-shadow: 0 5px 20px rgba(0,0,0,.1);
			}
			
			.bugs h3 { margin: 0.5em 0 0.5em; }
			.bugs p { margin: 0.5em 0 0.5em; line-height: 1.4em; }
			
			li, p {
				font-size: 0.9em;
				line-height: 1.4em;
			}
			ul {
				padding-left: 1em;
				margin-bottom: 2em;
			}
			
			#border {
				position: fixed;
				width: 100%;
				height: 100%;
				top: 0; left:0; right: 0; bottom: 0;
			}
			
		</style>
	</head>
	<body>
		<div id='border'></div>
		<section id='top'>
			<div class='content'>
				<h1>Welcome to<br>(beat) for iOS {{version}}</h1>
			</div>
		</section>
		<section id='notes'>
			<div class='content'>
	
				{{content}}
				
				<div class='bugs'>
					<h3>Bug reports</h3>
					<p>If something is not working correctly, visit Beat website to learn how to report bugs: <b>www.beat-app.fi</b></p>
				</div>
			</div>
		</section>
		</div>
	</body>
</html>
